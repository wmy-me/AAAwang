name: life-buy-agent-infra

services:
  postgres:
    image: postgres:17
    container_name: life-buy-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-life_buy_agent}
      POSTGRES_USER: ${POSTGRES_USER:-life_buy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-life_buy} -d ${POSTGRES_DB:-life_buy_agent}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
    name: life-buy-agent-postgres-data
