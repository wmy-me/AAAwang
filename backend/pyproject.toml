[project]
name = "life-agent"
version = "0.1.0"
description = "生活采买智能体 Python 主后端（FastAPI 框架初始化）"
readme = "README.md"
authors = [
    { name = "wmy-my", email = "1304156466@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2,<2",
    "argon2-cffi>=25.1.0,<26",
    "fastapi>=0.162.0",
    "jsonschema>=4.26.0,<5",
    "langgraph>=1.2.19",
    "mcp>=2.3.0,<3",
    "openai>=3.42.1",
    "psycopg[binary]>=3.2.13,<4",
    "pydantic-settings>=2.16.2",
    "socksio>=1.0.0",
    "sqlalchemy>=2.0.44,<3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
