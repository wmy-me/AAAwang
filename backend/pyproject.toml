[project]
name = "life-agent"
version = "0.1.0"
description = "生活采买智能体 Python 主后端（FastAPI 框架初始化）"
readme = "README.md"
authors = [
    { name = "wmy-my", email = "1304156466@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langgraph>=1.2.19",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
